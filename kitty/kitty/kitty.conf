
tab_bar_style hidden
background_opacity 0.85
# background_opacity 0.100

enable_audio_bell yes
visual_bell_duration 0.1

wheel_scroll_multiplier 0.1
momentum_scroll 0

confirm_os_window_close 1
clipboard_control write-clipboard write-primary read-clipboard read-primary-ask

font_size 17.0

# map ctrl+period send_text all \x1b[27;5;46~
# map ctrl+tab send_text all \x1b[27;5;9~

# >>> familiar >>> (managed by `familiar enable` — do not edit)
include familiar.conf
# <<< familiar <<<

# Re-apply own theme after familiar so it wins over look/ghostty.conf
# include themes.conf
font_family monospace
font_size 17.0
# tmux keybinds (prefix ctrl+b), ported from ~/.tmux.conf + tmux defaults.
# Pane = kitty window, window = kitty tab.
map ctrl+b>shift+5          launch --location=vsplit --cwd=last_reported
map ctrl+b>shift+apostrophe launch --location=hsplit --cwd=last_reported
map ctrl+b>c                launch --type=tab --cwd=last_reported
map ctrl+b>ctrl+b           send_key ctrl+b

# panes
map ctrl+b>left       neighboring_window left
map ctrl+b>right      neighboring_window right
map ctrl+b>up         neighboring_window up
map ctrl+b>down       neighboring_window down
map ctrl+b>o          next_window
map ctrl+b>semicolon  nth_window -1
map ctrl+b>q          focus_visible_window
map ctrl+b>z          toggle_layout stack
map ctrl+b>x          close_window_with_confirmation
map ctrl+b>shift+1    detach_window new-tab
map ctrl+b>shift+[    move_window backward
map ctrl+b>shift+]    move_window forward
map ctrl+b>ctrl+left  resize_window narrower
map ctrl+b>ctrl+right resize_window wider
map ctrl+b>ctrl+up    resize_window taller
map ctrl+b>ctrl+down  resize_window shorter

# tabs (base-index 1, same as tmux config)
map ctrl+b>n          next_tab
map ctrl+b>p          previous_tab
map ctrl+b>l          goto_tab -1
map ctrl+b>w          select_tab
map ctrl+b>comma      set_tab_title
map ctrl+b>shift+7    close_tab
map ctrl+b>1          goto_tab 1
map ctrl+b>2          goto_tab 2
map ctrl+b>3          goto_tab 3
map ctrl+b>4          goto_tab 4
map ctrl+b>5          goto_tab 5
map ctrl+b>6          goto_tab 6
map ctrl+b>7          goto_tab 7
map ctrl+b>8          goto_tab 8
map ctrl+b>9          goto_tab 9

# copy mode
map ctrl+b>[          show_scrollback

# Block cursor; no-cursor stops shell integration switching to a beam at the prompt
cursor_shape block
shell_integration enabled no-cursor

# Drop familiar's alt+d vsplit (and its Cyrillic-layout twin) so the key reaches programs
map alt+d
map alt+в

# Sessions (kanata: hold Space + L = last, S = picker, H/Q/N/C/U/D = session)
map ctrl+b>shift+l goto_session -1
map ctrl+b>shift+h goto_session ~/kitty/sessions/home.kitty-session
map ctrl+b>shift+q goto_session ~/kitty/sessions/qualiva.kitty-session
map ctrl+b>shift+n goto_session ~/kitty/sessions/note.kitty-session
map ctrl+b>shift+c goto_session ~/kitty/sessions/cp.kitty-session
map ctrl+b>shift+u goto_session ~/kitty/sessions/uni.kitty-session
map ctrl+b>shift+d goto_session ~/kitty/sessions/dotfiles.kitty-session
# fzf picker over open sessions (d closes one); shift+s = kitty's built-in picker of session files
action_alias launch_session_select launch --type=overlay bash -c "$HOME/kitty/scripts/kitty-list-sessions.sh"
map ctrl+b>s       launch_session_select
map ctrl+b>shift+s goto_session

# Tab bar at the bottom (familiar puts it on top)
tab_bar_edge bottom
# Only show tabs of the current session (otherwise sessions just look like extra tabs)
tab_bar_filter session:~ or session:^$

# familiar's clear_all_shortcuts drops kitty's ctrl+shift defaults; restore clipboard
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+equal     change_font_size all +2.0
map ctrl+shift+plus      change_font_size all +2.0
map ctrl+shift+minus     change_font_size all -2.0
map ctrl+shift+backspace change_font_size all 0
# Must come after `include familiar.conf` (its clear_all_shortcuts wipes earlier maps)
map ctrl+enter        send_text all \x1b[13;5u
map ctrl+shift+enter  send_text all \x1b[13;6u
map alt+shift+enter   send_text all \x1b[13;4u

# Bloom glow (requires kitty >= 0.49). Tune BLOOM_THRESHOLD/STRENGTH in shaders/bloom.slang
custom_shaders bloom

# Copy selection to the system clipboard (not just X PRIMARY)
copy_on_select clipboard

# Remote control over a private socket (for ~/.local/bin/kitty-reload)
allow_remote_control socket-only
listen_on unix:${XDG_RUNTIME_DIR}/kitty
map ctrl+shift+f5 launch --type=background ~/.local/bin/kitty-reload
