[[mgr.prepend_keymap]]
on   = "<C-s>"
for  = "unix"
run  = 'shell "$SHELL" --block'
desc = "Open $SHELL here"

# --- drag & drop that survives tmux (dragon-drop, GUI helper) ---
[[mgr.prepend_keymap]]
on   = "<C-g>"
for  = "unix"
run  = 'shell -- dragon-drop -x -i -T -a "$@"'
desc = "Drag selected files out"

[[mgr.prepend_keymap]]
on   = "<C-t>"
for  = "unix"
run  = 'shell -- dragon-drop -t -x -p | while IFS= read -r f; do cp -r -- "$f" .; done'
desc = "Drop files into this directory"

[[mgr.prepend_keymap]]
on   = [ "c", "a", "a" ]
run  = "plugin compress"
desc = "Archive selected files"

[[mgr.prepend_keymap]]
on   = [ "c", "a", "p" ]
run  = "plugin compress -p"
desc = "Archive selected files (password)"

[[mgr.prepend_keymap]]
on   = [ "c", "a", "h" ]
run  = "plugin compress -ph"
desc = "Archive selected files (password+header)"

[[mgr.prepend_keymap]]
on   = [ "c", "a", "l" ]
run  = "plugin compress -l"
desc = "Archive selected files (compression level)"

[[mgr.prepend_keymap]]
on   = [ "c", "a", "u" ]
run  = "plugin compress -phl"
desc = "Archive selected files (password+header+level)"
