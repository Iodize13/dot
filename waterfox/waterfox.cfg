// first line must be a comment
function kill(win) {
  win.document.getElementById("key_openAddons")?.remove();
}
Services.obs.addObserver(function (win) {
  win.addEventListener("load", () => {
    if (win.document.documentElement.getAttribute("windowtype") === "navigator:browser") kill(win);
  }, { once: true });
}, "domwindowopened");
